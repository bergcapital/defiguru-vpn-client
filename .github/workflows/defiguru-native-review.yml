name: DeFiGuru VPN unsigned review builds
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to compile
        type: choice
        options: [all, macos, android, ios, inspect-android]
        default: all
      android-artifact-run:
        description: Existing native build run to inspect without rebuilding
        type: string
        default: '39960364774'
permissions:
  contents: read
jobs:
  inspect-android:
    if: inputs.platform == 'inspect-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Retrieve only the existing public review artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.android-artifact-run }}
        run: |
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          gh run download "$ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" --name DeFiGuruVPN-Android-arm64-unsigned-review --dir android-artifact
      - name: Verify installed package, brand pixels, provider authority and signing state
        run: |
          python3 -m pip install 'Pillow==11.3.0'
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          python3 branding/inspect-android.py android-artifact android-review "$tools_dir"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeFiGuruVPN-Android-brand-inspection
          path: android-review/
          if-no-files-found: error
          retention-days: 14
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install 'conan==2.28.0' 'cmake>=3.25,<4.2' ninja jsonschema jinja2
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.10.1'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtremoteobjects qt5compat qtshadertools qtimageformats qtmultimedia
          dir: ${{ runner.temp }}
          cache: true
      - name: Compile unsigned macOS app and VPN extension
        env:
          QT_ROOT_PATH: ${{ runner.temp }}/Qt/6.10.1
        run: bash branding/build-unsigned.sh macos
      - name: Bundle Qt frameworks and archive unsigned review app
        run: |
          "$RUNNER_TEMP/Qt/6.10.1/macos/bin/macdeployqt" build-defiguru-macos/client/Release/DeFiGuruVPN.app -qmldir=client/ui/qml -no-strip
          ditto -c -k --keepParent build-defiguru-macos/client/Release/DeFiGuruVPN.app DeFiGuruVPN-macOS-unsigned.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeFiGuruVPN-macOS-unsigned-review
          path: DeFiGuruVPN-macOS-unsigned.zip
          if-no-files-found: error
          retention-days: 14
  ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install 'conan==2.28.0' 'cmake>=3.25,<4.2' ninja jsonschema jinja2
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.10.1'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtremoteobjects qt5compat qtshadertools qtimageformats
          dir: ${{ runner.temp }}
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.10.1'
          host: mac
          target: ios
          arch: ios
          modules: qtremoteobjects qt5compat qtshadertools qtimageformats
          dir: ${{ runner.temp }}
          cache: true
      - name: Compile unsigned iPhone app and VPN extension
        env:
          QT_ROOT_PATH: ${{ runner.temp }}/Qt/6.10.1
        run: bash branding/build-unsigned.sh ios
      - name: Archive iOS review bundle without signing or store submission
        run: |
          app=build-defiguru-ios/client/Release-iphoneos/DeFiGuruVPN.app
          test -d "$app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = ai.defiguru.vpn
          ditto -c -k --keepParent "$app" DeFiGuruVPN-iOS-unsigned-review.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeFiGuruVPN-iOS-unsigned-review
          path: DeFiGuruVPN-iOS-unsigned-review.zip
          if-no-files-found: error
          retention-days: 14
  android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.0.11718014
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: |
          sdkmanager 'platforms;android-30' 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
          python -m pip install 'conan==2.28.0' 'cmake>=3.25,<4.2' ninja jsonschema jinja2
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.10.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtremoteobjects qt5compat qtshadertools qtimageformats
          dir: ${{ runner.temp }}
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.10.1'
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtremoteobjects qt5compat qtshadertools qtimageformats
          dir: ${{ runner.temp }}
          cache: true
      - name: Compile unsigned Android arm64 APK
        env:
          QT_ROOT_PATH: ${{ runner.temp }}/Qt/6.10.1
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          bash branding/build-unsigned.sh android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeFiGuruVPN-Android-arm64-unsigned-review
          path: build-defiguru-android/client/android-build*/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
