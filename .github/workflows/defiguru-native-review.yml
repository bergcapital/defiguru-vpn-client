name: DeFiGuru VPN unsigned review builds
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to compile
        type: choice
        options: [all, macos, android, ios, inspect-android, capture-macos]
        default: all
      android-artifact-run:
        description: Existing native build run to inspect without rebuilding
        type: string
        default: '39960364774'
      macos-artifact-run:
        description: Existing compiled macOS review artifact to capture without rebuilding
        type: string
        default: '40001578638'
permissions:
  contents: read
jobs:
  capture-macos:
    if: inputs.platform == 'capture-macos'
    runs-on: macos-15-intel
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Retrieve the existing public unsigned macOS review artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.macos-artifact-run }}
        run: |
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          gh run download "$ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" --name DeFiGuruVPN-macOS-unsigned-review --dir compiled-macos
          ditto -x -k compiled-macos/DeFiGuruVPN-macOS-unsigned.zip .
      - name: Capture actual empty welcome QML without connecting
        timeout-minutes: 2
        run: |
          capture_settings="$(mktemp -d)"
          DEFIGURU_REVIEW_SETTINGS_DIR="$capture_settings" DEFIGURU_REVIEW_CAPTURE_PATH="$GITHUB_WORKSPACE/DeFiGuruVPN-welcome.png" QT_QUICK_BACKEND=software QT_QPA_PLATFORM=cocoa QT_PLUGIN_PATH="$GITHUB_WORKSPACE/DeFiGuruVPN.app/Contents/PlugIns" DeFiGuruVPN.app/Contents/MacOS/DeFiGuruVPN
          test -s DeFiGuruVPN-welcome.png
          python -m pip install 'Pillow==11.3.0'
          python - <<'PYIMAGE'
          from PIL import Image, ImageStat
          image = Image.open('DeFiGuruVPN-welcome.png').convert('RGB')
          assert image.width >= 320 and image.height >= 480, 'Unexpected welcome dimensions'
          assert max(ImageStat.Stat(image).stddev) > 15, 'Blank or uniform welcome capture'
          footer = image.crop((int(image.width * .2), int(image.height * .80), int(image.width * .8), int(image.height * .92)))
          assert sum(min(pixel) > 100 for pixel in footer.getdata()) >= 60, 'Powered by footer is absent, clipped or low contrast'
          print(f'Actual QML welcome and visible footer: {image.width}x{image.height}')
          PYIMAGE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeFiGuruVPN-actual-welcome-preview
          path: DeFiGuruVPN-welcome.png
          if-no-files-found: error
          retention-days: 14
  inspect-android:
    if: inputs.platform == 'inspect-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Retrieve only the existing public review artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.android-artifact-run }}
        run: |
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          gh run download "$ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" --name DeFiGuruVPN-Android-arm64-unsigned-review --dir android-artifact
      - name: Verify installed package, brand pixels, provider authority and signing state
        run: |
          python3 -m pip install 'Pillow==11.3.0'
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          python3 branding/inspect-android.py android-artifact android-review "$tools_dir"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeFiGuruVPN-Android-brand-inspection
          path: android-review/
          if-no-files-found: error
          retention-days: 14
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install 'conan==2.28.0' 'cmake>=3.25,<4.2' ninja jsonschema jinja2
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.10.1'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtremoteobjects qt5compat qtshadertools qtimageformats qtmultimedia
          dir: ${{ runner.temp }}
          cache: true
      - name: Compile unsigned macOS app and VPN extension
        env:
          QT_ROOT_PATH: ${{ runner.temp }}/Qt/6.10.1
        run: bash branding/build-unsigned.sh macos
      - name: Bundle Qt frameworks and archive unsigned review app
        run: |
          "$RUNNER_TEMP/Qt/6.10.1/macos/bin/macdeployqt" build-defiguru-macos/client/Release/DeFiGuruVPN.app -qmldir=client/ui/qml -no-strip
          ditto -c -k --keepParent build-defiguru-macos/client/Release/DeFiGuruVPN.app DeFiGuruVPN-macOS-unsigned.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeFiGuruVPN-macOS-unsigned-review
          path: DeFiGuruVPN-macOS-unsigned.zip
          if-no-files-found: error
          retention-days: 14
      - name: Capture actual empty welcome QML without connecting
        timeout-minutes: 2
        run: |
          capture_settings="$(mktemp -d)"
          DEFIGURU_REVIEW_SETTINGS_DIR="$capture_settings" DEFIGURU_REVIEW_CAPTURE_PATH="$GITHUB_WORKSPACE/DeFiGuruVPN-welcome.png" QT_QUICK_BACKEND=software QT_QPA_PLATFORM=cocoa QT_PLUGIN_PATH="$RUNNER_TEMP/Qt/6.10.1/macos/plugins" build-defiguru-macos/client/Release/DeFiGuruVPN.app/Contents/MacOS/DeFiGuruVPN
          test -s DeFiGuruVPN-welcome.png
          python -m pip install 'Pillow==11.3.0'
          python - <<'PYIMAGE'
          from PIL import Image, ImageStat
          image = Image.open('DeFiGuruVPN-welcome.png').convert('RGB')
          assert image.width >= 320 and image.height >= 480, 'Unexpected welcome dimensions'
          assert max(ImageStat.Stat(image).stddev) > 15, 'Blank or uniform welcome capture'
          footer = image.crop((int(image.width * .2), int(image.height * .80), int(image.width * .8), int(image.height * .92)))
          assert sum(min(pixel) > 100 for pixel in footer.getdata()) >= 60, 'Powered by footer is absent, clipped or low contrast'
          print(f'Actual QML welcome and visible footer: {image.width}x{image.height}')
          PYIMAGE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeFiGuruVPN-actual-welcome-preview
          path: DeFiGuruVPN-welcome.png
          if-no-files-found: error
          retention-days: 14
  ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install 'conan==2.28.0' 'cmake>=3.25,<4.2' ninja jsonschema jinja2
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.10.1'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtremoteobjects qt5compat qtshadertools qtimageformats
          dir: ${{ runner.temp }}
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.10.1'
          host: mac
          target: ios
          arch: ios
          modules: qtremoteobjects qt5compat qtshadertools qtimageformats
          dir: ${{ runner.temp }}
          cache: true
      - name: Compile unsigned iPhone app and VPN extension
        env:
          QT_ROOT_PATH: ${{ runner.temp }}/Qt/6.10.1
        run: bash branding/build-unsigned.sh ios
      - name: Archive iOS review bundle without signing or store submission
        run: |
          app=build-defiguru-ios/client/Release-iphoneos/DeFiGuruVPN.app
          test -d "$app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = ai.defiguru.vpn
          ditto -c -k --keepParent "$app" DeFiGuruVPN-iOS-unsigned-review.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeFiGuruVPN-iOS-unsigned-review
          path: DeFiGuruVPN-iOS-unsigned-review.zip
          if-no-files-found: error
          retention-days: 14
  android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.0.11718014
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: |
          sdkmanager 'platforms;android-30' 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
          python -m pip install 'conan==2.28.0' 'cmake>=3.25,<4.2' ninja jsonschema jinja2
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.10.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtremoteobjects qt5compat qtshadertools qtimageformats
          dir: ${{ runner.temp }}
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.10.1'
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtremoteobjects qt5compat qtshadertools qtimageformats
          dir: ${{ runner.temp }}
          cache: true
      - name: Compile unsigned Android arm64 APK
        env:
          QT_ROOT_PATH: ${{ runner.temp }}/Qt/6.10.1
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          bash branding/build-unsigned.sh android
      - name: Build the separately identified installable Android Preview
        run: |
          android_tree="$(find build-defiguru-android/client -mindepth 1 -maxdepth 1 -type d -name 'android-build*' | head -1)"
          test -n "$android_tree"
          (cd "$android_tree" && ./gradlew assembleOssDebug)
          preview_apk="$(find "$android_tree/build/outputs/apk/oss/debug" -maxdepth 1 -name '*.apk' -type f | head -1)"
          test -f "$preview_apk"
          mkdir android-preview
          cp "$preview_apk" android-preview/DeFiGuruVPN-Android-Preview.apk
          python3 -m pip install 'Pillow==11.3.0'
          python3 branding/inspect-android.py android-preview android-preview-inspection "$ANDROID_HOME/build-tools/36.0.0" ai.defiguru.vpn.review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeFiGuruVPN-Android-installable-Preview
          path: android-preview/DeFiGuruVPN-Android-Preview.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeFiGuruVPN-Android-Preview-inspection
          path: android-preview-inspection/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeFiGuruVPN-Android-arm64-unsigned-review
          path: build-defiguru-android/client/android-build*/build/outputs/apk/oss/release/*.apk
          if-no-files-found: error
          retention-days: 14
